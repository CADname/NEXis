name: public-repo-check

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public repository guard
        run: python scripts/public_repo_check.py
      - name: Dataset and evaluation evidence
        run: python scripts/validate_evidence.py
      - name: Python syntax
        run: python -m py_compile app/main.py app/ai_model.py scripts/public_repo_check.py scripts/validate_evidence.py training/reproduce_training.py
      - name: JavaScript syntax
        run: node --check app/web/assets/app.js && node --check app/web/assets/digital_twin.js
      - name: Shell syntax
        run: bash -n prepare.sh
